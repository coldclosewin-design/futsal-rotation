<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>참석 투표 · FC EXICAN</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="styles.css?v=20261018a">
</head>
<body class="rollout-page">
  <h1>참석 투표</h1>
  <main class="vote-page page-grid">
    <div id="member-badge" class="identity-line page-wide"></div>
    <section class="board page-board" aria-label="선택한 투표 요약">
      <nav id="poll-switch" class="poll-switch" aria-label="투표 선택" hidden></nav>
      <div class="board-row"><div><p class="label">참석 투표</p><p id="poll-title" class="board-title">경기 확인 중</p><div id="poll-badges" class="poll-badges"></div></div><p class="display" id="poll-count" aria-label="참석 인원">—</p></div>
      <div class="segments">
        <div class="segment is-dim" id="poll-state-segment"><span class="label">상태</span><b id="poll-status">확인 중</b></div>
        <div class="segment"><span class="label">마감까지</span><b id="poll-deadline">—</b></div>
        <div class="segment"><span class="label">가능 포맷</span><b id="poll-formats">—</b></div>
      </div>
      <div class="board-lines">
        <p id="poll-match" class="board-line" data-label="경기 일시" aria-live="polite" hidden></p>
      </div>
    </section>
    <p id="page-message" role="status">투표를 불러오는 중입니다…</p>
    <section id="poll-panel" class="card" aria-labelledby="vote-title" hidden>
      <h2 id="vote-title">참석 여부</h2>
      <div class="vote-actions" aria-label="참석 여부">
        <button type="button" data-choice="attend" aria-pressed="false">참석</button>
        <button type="button" data-choice="absent" aria-pressed="false">불참</button>
      </div>
      <p id="vote-notice" class="meta"></p>
    </section>
    <section id="attendance-panel" class="card" aria-labelledby="attendance-title" hidden>
      <h2 id="attendance-title">투표 현황</h2>
      <p id="attendance-summary" aria-live="polite"></p>
      <div id="attendance-lists"></div>
    </section>
    <section id="admin-panel" class="card" aria-labelledby="admin-title" hidden>
      <h2 id="admin-title">회장 도구</h2>
      <div class="rows flat-rows"><div class="row"><span class="row-main"><span class="row-label">새 경기 투표</span><span class="row-sub">정기 경기·공휴일·이벤트</span></span><button class="row-action" type="button" id="create-poll">투표 만들기</button></div></div>
      <div class="home-actions"><button class="btn-destructive" type="button" id="poll-cancel">투표 취소</button><button class="btn-destructive" type="button" id="poll-delete">투표 삭제</button></div>
      <p class="meta">취소는 "이번 경기 없음"(기록 유지), 삭제는 잘못 만든 투표를 지우는 것입니다. 매치나 벌금 기록이 연결된 투표는 삭제할 수 없습니다.</p>
    </section>
    <dialog id="vote-dialog" class="operations-dialog" aria-labelledby="vote-dialog-title"></dialog>
  </main>

  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/ui.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/candidates.js"></script>
  <script src="js/member.js"></script>
  <script src="js/data.js"></script>
  <script src="js/poll-form.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      renderNav("vote");
      const demo = ExicanData.mode() === "demo";
      const rules = ExicanRules;
      const message = document.getElementById("page-message");
      const buttons = Array.from(document.querySelectorAll("[data-choice]"));
      const cancel = document.getElementById("poll-cancel");
      const create = document.getElementById("create-poll");
      const remove = document.getElementById("poll-delete");
      const matchLine = document.getElementById("poll-match");
      const dialog = document.getElementById("vote-dialog");
      const pageUrl = (page) => {
        const url = new URL(page, location.href);
        if (demo) url.searchParams.set("demo", "1");
        return url.href;
      };
      let members = [];
      let matches = [];
      let matchState = "ready";
      let poll = null;
      let polls = [];
      let version = 0;
      let votes = [];
      let member = null;
      let role = "anon";
      let busy = false;

      function render() {
        const now = new Date().toISOString();
        const admin = demo ? Boolean(member?.is_president) : role === "admin";
        document.getElementById("admin-panel").hidden = !admin;
        document.getElementById("admin-title").textContent = demo ? "회장 도구 · 데모" : "회장 도구";
        cancel.disabled = !poll || busy;
        cancel.textContent = poll?.cancelled ? "투표 취소 해제" : "투표 취소";
        remove.disabled = !poll || busy;
        create.disabled = busy;
        const switcher = document.getElementById("poll-switch");
        switcher.hidden = polls.length < 2;
        // 주기적인 상태 갱신에서도 포커스가 머무는 칩을 유지한다.
        if (switcher.children.length !== polls.length || polls.some((row, index) => switcher.children[index]?.dataset.pollId !== row.id)) {
          switcher.textContent = "";
          for (const row of polls) {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "chip";
            button.dataset.pollId = row.id;
            button.addEventListener("click", () => mutate(() => loadPoll(row.id)));
            switcher.appendChild(button);
          }
        }
        polls.forEach((row, index) => {
          const button = switcher.children[index];
          const status = { open: "진행 중", scheduled: "예정", closed: "마감" }[rules.pollStatus(row, now)];
          button.textContent = `${rules.pollTitle(row)} · ${status}`;
          button.setAttribute("aria-pressed", String(row.id === poll?.id));
          button.disabled = busy;
        });
        const badges = document.getElementById("poll-badges");
        badges.textContent = "";
        document.getElementById("poll-panel").hidden = !poll;
        document.getElementById("attendance-panel").hidden = !poll;
        renderMatchLine();
        if (!poll) {
          document.getElementById("poll-title").textContent = "투표 없음";
          for (const id of ["poll-count", "poll-deadline", "poll-formats"]) document.getElementById(id).textContent = "—";
          document.getElementById("poll-status").textContent = "없음";
          document.getElementById("poll-state-segment").className = "segment is-dim";
          return;
        }
        document.getElementById("poll-title").textContent = rules.pollTitle(poll);
        for (const label of [rules.isSpecialPoll(poll) ? "특별" : null, poll.fines === false ? "벌금 없음" : null].filter(Boolean)) {
          const chip = document.createElement("span");
          chip.className = "chip";
          chip.textContent = label;
          badges.appendChild(chip);
        }
        const status = rules.pollStatus(poll, now);
        const badge = document.getElementById("poll-status");
        badge.textContent = { scheduled: "예정", open: "진행 중", closed: "마감됨", cancelled: "취소됨" }[status];
        badge.dataset.status = status;
        document.getElementById("poll-state-segment").className = `segment${status === "scheduled" || status === "cancelled" ? " is-dim" : ""}`;
        const deadline = document.getElementById("poll-deadline");
        const remaining = Math.max(0, Math.ceil((new Date(poll.closes_at) - new Date(now)) / 60000));
        const days = Math.floor(remaining / 1440);
        const hours = Math.floor(remaining % 1440 / 60);
        const duration = days ? `${days}일 ${hours}시간` : hours ? `${hours}시간 ${remaining % 60}분` : `${remaining}분`;
        deadline.textContent = status === "cancelled" ? "취소" : status === "closed" ? "마감" : duration;
        deadline.title = `${ExicanPollForm.formatTime(poll.closes_at)} 마감 (한국 시간)`;
        if (member) ExicanMember.renderBadge(document.getElementById("member-badge"), member, async () => {
          ExicanMember.clear();
          member = await ExicanMember.ensure(members);
          render();
        });
        const selected = votes.find((vote) => vote.member_id === member?.id)?.choice;
        for (const button of buttons) {
          button.setAttribute("aria-pressed", String(button.dataset.choice === selected));
          button.disabled = busy || !member || (!demo && role === "anon") || status === "scheduled" || status === "cancelled";
        }
        document.getElementById("vote-notice").textContent = status === "closed" ? poll.fines === false ? "마감된 투표입니다. 미투표·지각 투표 벌금은 없습니다" : "마감 후 투표는 벌금 대상입니다" :
          status === "scheduled" ? `${ExicanPollForm.formatTime(poll.opens_at)}부터 투표할 수 있습니다 (한국 시간)` :
          status === "cancelled" ? "취소된 투표에는 참여할 수 없습니다" : `마감 ${ExicanPollForm.formatTime(poll.closes_at)} (한국 시간) · 마감 전까지 참석 여부를 변경할 수 있습니다`;
        const summary = rules.attendanceSummary(votes, members);
        document.getElementById("poll-count").textContent = summary.count;
        document.getElementById("poll-formats").textContent = Object.entries(summary.formats).filter(([, info]) => info.ok).map(([format]) => format).join(" · ") || "인원 부족";
        document.getElementById("attendance-summary").textContent = `참석 ${summary.count}명 · ` +
          Object.entries(summary.formats).map(([format, info]) => info.ok ? `${format} 가능 (휴식 ${info.rest}명)` : `${format} 불가 (인원 부족)`).join(" · ");
        const lists = document.getElementById("attendance-lists");
        lists.textContent = "";
        for (const [key, label] of [["attend", "참석"], ["absent", "불참"], ["pending", "미투표"]]) {
          const heading = document.createElement("h3");
          heading.textContent = `${label} ${summary[key].length}명`;
          const list = document.createElement("ul");
          list.className = "vote-member-list";
          list.setAttribute("aria-label", label);
          for (const person of summary[key]) {
            const item = document.createElement("li");
            const name = document.createElement("span");
            if (key === "pending" && status === "open") name.className = "lit-dot";
            name.textContent = person.name;
            item.appendChild(name);
            const vote = votes.find((row) => row.member_id === person.id);
            if (vote?.is_late) {
              const late = document.createElement("span");
              late.className = "late-badge";
              late.textContent = "지각";
              item.appendChild(late);
            }
            if (vote) {
              const time = document.createElement("time");
              time.dateTime = vote.updated_at;
              time.textContent = rules.formatRelative(vote.updated_at, now);
              item.appendChild(time);
            }
            list.appendChild(item);
          }
          if (!summary[key].length) {
            const empty = document.createElement("li");
            empty.textContent = "없음";
            list.appendChild(empty);
          }
          lists.append(heading, list);
        }
      }

      // 보드의 "경기 일시" 줄: 확정 매치가 있으면 시간·구장·상대, 없으면 날짜와 미확정 표시. 매치 조회 실패는 투표를 막지 않는다.
      function renderMatchLine() {
        matchLine.hidden = !poll;
        matchLine.textContent = "";
        if (!poll) return;
        if (matchState === "error") { matchLine.textContent = "매치 정보를 불러오지 못했습니다"; return; }
        const line = rules.pollMatchLine(poll, rules.matchForPoll(poll, matches));
        const link = document.createElement("a");
        link.href = pageUrl(line.confirmed ? "matches.html#confirmed-matches" : "matches.html");
        link.textContent = line.title;
        const hint = document.createElement("span");
        hint.className = "board-link-hint";
        hint.textContent = line.confirmed ? "상세" : "매칭 탭";
        link.appendChild(hint);
        const sub = document.createElement("span");
        sub.className = "board-sub";
        sub.textContent = line.sub;
        matchLine.append(link, sub);
      }
      async function loadMatches() {
        try {
          const today = rules.kstDate(new Date().toISOString());
          const rows = await ExicanData.matches({ from: demo ? undefined : today });
          matches = demo ? ExicanCandidates.shiftDemoDates(rows, today) : rows;
          matchState = "ready";
        } catch (error) {
          matches = [];
          matchState = "error";
        }
      }
      function confirmDelete() {
        return new Promise((resolve) => {
          let settled = false;
          const done = (value) => { if (!settled) { settled = true; resolve(value); } };
          dialog.innerHTML = `<form class="operations-form"><h2 id="vote-dialog-title">투표 삭제</h2><p>${escapeHtml(rules.pollTitle(poll))} 투표를 지웁니다. 투표 기록 ${votes.length}건이 함께 삭제되고 되돌릴 수 없습니다.</p><p class="meta">자동 생성 창(일요일 13:00~월요일 13:00) 안이면 다음 자동 작업이 같은 날짜 투표를 다시 만듭니다. 이번 경기를 안 하는 것이면 삭제 대신 취소를 쓰세요.</p><div class="home-actions"><button type="button" class="secondary" data-close>취소</button><button type="submit" class="btn-destructive">삭제</button></div></form>`;
          dialog.querySelector("[data-close]").onclick = () => dialog.close();
          dialog.querySelector("form").onsubmit = (event) => { event.preventDefault(); done(true); dialog.close(); };
          dialog.onclose = () => done(false);
          dialog.showModal();
        });
      }
      async function loadPoll(preferredId = poll?.id) {
        const request = ++version;
        const [upcoming] = await Promise.all([ExicanData.upcomingPolls(), loadMatches()]);
        const selected = upcoming.find((row) => row.id === preferredId) ||
          upcoming.find((row) => rules.pollStatus(row, new Date().toISOString()) === "open") || upcoming[0] || null;
        const ballot = selected ? await ExicanData.votes(selected.id) : [];
        if (request !== version) return;
        polls = upcoming;
        poll = selected;
        votes = ballot;
        message.hidden = Boolean(poll);
        message.textContent = poll ? "" : "아직 열린 투표가 없습니다. 일요일 13:00에 자동 생성됩니다.";
        render();
      }

      async function mutate(operation) {
        if (busy) return;
        busy = true;
        render();
        try { await operation(); }
        catch (error) { showToast(error.message); }
        finally { busy = false; render(); }
      }

      buttons.forEach((button) => button.addEventListener("click", () => mutate(async () => {
        const request = version;
        const saved = await ExicanData.castVote(poll.id, member.id, button.dataset.choice);
        if (request !== version) return;
        votes = votes.filter((vote) => vote.member_id !== saved.member_id).concat(saved);
        showToast(`${saved.choice === "attend" ? "참석" : "불참"}으로 저장했습니다${saved.is_late ? " · 지각 투표" : ""}`);
      })));
      cancel.addEventListener("click", () => {
        const checked = !poll.cancelled;
        mutate(async () => {
          const request = version;
          await ExicanData.setPollCancelled(poll.id, checked);
          if (request !== version) return;
          await loadPoll();
          showToast(checked ? "투표를 취소했습니다" : "투표 취소를 해제했습니다");
        });
      });
      create.addEventListener("click", async () => {
        const created = await ExicanPollForm.open();
        if (created) await mutate(() => loadPoll(created.id));
      });
      remove.addEventListener("click", async () => {
        if (!poll || busy || !(await confirmDelete())) return;
        const target = poll;
        mutate(async () => {
          const request = version;
          await ExicanData.deletePoll(target.id);
          if (request !== version) return;
          poll = null;
          await loadPoll();
          showToast("투표를 삭제했습니다");
        });
      });

      try {
        try { await ExicanAuth.renderAuthBar(); }
        catch (error) { if (!demo) throw error; }
        if (!demo) role = await ExicanAuth.requireTeam();
        members = await ExicanData.members();
        await loadPoll();
        member = await ExicanMember.ensure(members);
        render();
        if (!demo) await ExicanAuth.onAuthChange(async (event, session) => {
          role = roleFromEmail(session?.user?.email, EXICAN_CONFIG);
          if (role !== "admin") ExicanPollForm.close();
          if (role === "anon") {
            version += 1;
            polls = [];
            poll = null;
            votes = [];
            message.hidden = false;
            message.textContent = "팀 로그인 후 투표를 확인하세요";
            render();
          } else {
            members = await ExicanData.members();
            member = await ExicanMember.ensure(members);
            await loadPoll();
          }
        });
        setInterval(render, 60000);
      } catch (error) {
        message.hidden = false;
        message.textContent = `투표를 불러오지 못했습니다: ${error.message}. 새로고침해 주세요.`;
        showToast(error.message);
      }
    });
  </script>
</body>
</html>
