<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>도움말 · FC EXICAN</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="styles.css?v=20261018a">
</head>
<body class="rollout-page">
  <h1>도움말</h1>

  <main class="help-page page-grid">
    <nav class="rows page-wide" aria-label="바로가기">
      <a class="row" href="#팀원-편"><span class="row-main"><span class="row-label">팀원 편</span><span class="row-sub">처음 설정, 투표, 추천, 간식 청구, 내 현황</span></span><span class="row-end"><span class="row-action">이동</span></span></a>
      <a class="row" href="#회장-편"><span class="row-main"><span class="row-label">회장 편</span><span class="row-sub">주간 운영, 매칭, 배정표, 출석·벌금, 정산</span></span><span class="row-end"><span class="row-action">이동</span></span></a>
    </nav>

    <article id="help-content" class="rules-document page-wide" aria-busy="true">
      <p role="status">도움말을 불러오는 중입니다.</p>
    </article>

    <aside class="rules-notice page-wide">도움말에 없는 문제는 회장에게 개인톡으로</aside>
  </main>

  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/markdown-lite.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      renderNav("help");
      const content = document.getElementById("help-content");
      try {
        const response = await fetch("docs/guide.md");
        if (!response.ok) throw new Error("도움말을 불러오지 못했습니다.");
        content.innerHTML = renderMarkdownLite(await response.text());
        content.querySelector("h1")?.remove();
        content.querySelectorAll("h2").forEach(heading => {
          heading.id = heading.textContent.trim().replace(/\s+/g, "-");
          if (encodeURIComponent(heading.id) === location.hash.slice(1)) heading.scrollIntoView();
        });
      } catch (error) {
        content.innerHTML = "<p role=\"alert\">도움말을 불러오지 못했습니다. 잠시 후 새로고침하거나 <a href=\"docs/guide.md\">도움말 원문</a>을 확인하세요.</p>";
      } finally {
        content.setAttribute("aria-busy", "false");
      }
    });
  </script>
</body>
</html>
