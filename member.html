<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>멤버 현황 · FC EXICAN</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="styles.css?v=20261018c">
</head>
<body class="rollout-page">
  <h1>내 현황</h1>
  <main class="operations-page member-page">
    <label id="member-picker" class="member-switch identity-line" hidden>다른 멤버 보기<select id="member-select"></select></label>
    <section class="board page-board" aria-label="내 현황 요약">
      <div class="board-row"><div><p id="member-board-month" class="label">이번 달 미납</p><p id="member-board-name" class="board-title">멤버 확인 중</p></div><p id="member-outstanding" class="display">—</p></div>
      <div class="segments">
        <div class="segment"><span class="label">12주 참석률</span><b id="member-rate">—</b></div>
        <div class="segment"><span class="label">투표 참여율</span><b id="member-vote-rate">—</b></div>
        <div class="segment"><span class="label">키퍼 누적</span><b id="member-gk">—</b></div>
      </div>
    </section>
    <p id="member-message" role="status">현황을 불러오는 중입니다…</p>
    <button id="member-retry" type="button" hidden>다시 불러오기</button>
    <div id="member-content" class="page-grid"></div>
  </main>
  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/ui.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/member.js"></script>
  <script src="js/data.js"></script>
  <script src="js/ledger-rules.js"></script>
  <script src="js/data-ledger.js"></script>
  <script src="js/attendance-rules.js"></script>
  <script src="js/data-admin.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      renderNav("member");
      const data = ExicanData, rules = ExicanAttendance, e = escapeHtml;
      const get = (id) => document.getElementById(id);
      const demo = data.mode() === "demo";
      let people = [], selected = new URLSearchParams(location.search).get("id"), version = 0;
      function resetBoard() {
        get("member-board-name").textContent = "멤버 확인 중";
        for (const id of ["member-outstanding", "member-rate", "member-vote-rate", "member-gk"]) get(id).textContent = "—";
        get("member-outstanding").classList.remove("is-lit");
        get("member-picker").hidden = true;
      }

      async function load() {
        const request = ++version;
        resetBoard();
        get("member-retry").hidden = true;
        get("member-content").textContent = "";
        get("member-message").hidden = false;
        get("member-message").textContent = "현황을 불러오는 중입니다…";
        try {
          if (!demo && !["team", "admin"].includes(await ExicanAuth.getRole())) throw new Error("팀 로그인 후 현황을 확인하세요");
          people = await data.members();
          if (!selected) selected = (await ExicanMember.ensure(people)).id;
          const person = people.find((row) => row.id === selected);
          if (!person) throw new Error("활동 멤버를 찾을 수 없습니다. 주소의 멤버 ID를 확인하세요");
          const today = ExicanRules.kstDate(new Date()), month = today.slice(0, 7);
          const from = new Date(Date.parse(`${today}T00:00:00Z`) - 84 * 86400000).toISOString().slice(0, 10);
          const [rows, polls, matches, history] = await Promise.all([data.ledgerRange(), data.polls({ from, to: today }), data.matches({ from }), data.rotationHistory({ memberId: selected })]);
          const votes = await data.votesByPolls(polls.map((poll) => poll.id));
          const games = matches.filter((match) => match.status === "played" && match.match_date <= today);
          const attendance = (await Promise.all(games.map((match) => data.attendance(match.id)))).flat();
          if (request !== version) return;
          const total = ExicanLedgerRules.memberSummary(rows, selected, month);
          const outstanding = rows.filter((row) => row.member_id === selected && !row.settled).reduce((sum, row) => sum + Number(row.amount), 0);
          const fines = rows.filter((row) => row.member_id === selected && row.category.startsWith("fine_")).sort((a, b) => b.entry_date.localeCompare(a.entry_date) || b.id - a.id).slice(0, 20);
          const rate = rules.attendanceRate(games, votes, attendance, selected, 12, today);
          const eligiblePolls = polls.filter((poll) => !poll.cancelled);
          const voted = eligiblePolls.filter((poll) => votes.some((vote) => vote.poll_id === poll.id && vote.member_id === selected)).length;
          const rotation = rules.rotationTotals(history, selected);
          get("member-board-name").textContent = person.name;
          get("member-board-month").textContent = `${month} · ${total.outstanding < 0 ? "환급 대기" : "이번 달 미납"}`;
          get("member-outstanding").textContent = total.outstanding < 0 ? `받을 돈 ${formatWon(-total.outstanding)}` : formatWon(total.outstanding);
          get("member-rate").textContent = rate.rate === null ? "기록 없음" : `${Math.round(rate.rate * 100)}%`;
          get("member-vote-rate").textContent = eligiblePolls.length ? `${Math.round(voted / eligiblePolls.length * 100)}%` : "기록 없음";
          get("member-gk").textContent = `${rotation.gk}회`;
          get("member-outstanding").classList.toggle("is-lit", total.outstanding > 0);
          get("member-select").innerHTML = people.map((row) => `<option value="${e(row.id)}" ${row.id === selected ? "selected" : ""}>${e(row.name)}</option>`).join("");
          get("member-picker").hidden = false;
          get("member-content").innerHTML = `<section class="card"><h2>${e(month)} 납부</h2><dl class="rows flat-rows">${[["회비", total.due], ["벌금", total.fine], ["면제", total.exempt], ["환급", total.refund], ["정산 완료", total.settled], ["전 기간 미정산", outstanding]].map(([label, amount]) => `<div class="row"><dt class="row-label">${label}</dt><dd class="row-figure">${formatWon(amount)}</dd></div>`).join("")}</dl></section>
            <section class="rows" aria-label="벌금 이력"><h2 class="row">벌금 이력 · 최근 20건</h2>${fines.map((row) => `<div class="row"><span class="row-main"><time class="row-label" datetime="${e(row.entry_date)}">${e(row.entry_date)}</time><span class="row-sub">${e(ExicanLedgerRules.CATEGORY_LABELS[row.category])} · ${row.settled ? "정산 완료" : "미정산"}</span></span><span class="row-figure">${formatWon(row.amount)}</span></div>`).join("") || '<p class="row">기록 없음</p>'}</section>
            <section class="card"><h2>최근 12주 참여</h2><div class="rows flat-rows"><div class="row"><span class="row-main"><span class="row-label">완료 경기 출석</span><span class="row-sub">지각·경기 후 도착도 출석으로 집계</span></span><span class="row-figure">${rate.attended}/${rate.polled}회</span></div><div class="row"><span class="row-label">투표 참여</span><span class="row-figure">${voted}/${eligiblePolls.length}회</span></div></div></section>
            <section class="rows" aria-label="배정 누적"><h2 class="row">배정 누적</h2>${[["경기 수", rotation.matches], ["키퍼", rotation.gk], ["휴식", rotation.rest], ["키퍼·휴식 쿼터", rotation.outQuarters]].map(([label, count]) => `<div class="row"><span class="row-label">${label}</span><span class="row-figure">${count}회</span></div>`).join("")}<p class="row row-sub">경기당 평균 · 키퍼 ${rotation.matches ? (rotation.gk / rotation.matches).toFixed(1) : "0"}회 / 휴식 ${rotation.matches ? (rotation.rest / rotation.matches).toFixed(1) : "0"}회</p></section>`;
          get("member-message").hidden = true;
          get("member-select").onchange = (event) => {
            selected = event.target.value;
            const url = new URL(location.href); url.searchParams.set("id", selected);
            window.history.replaceState(null, "", url);
            load();
          };
        } catch (error) {
          if (request !== version) return;
          get("member-content").textContent = "";
          get("member-message").textContent = error.message;
          get("member-retry").hidden = false;
        }
      }
      get("member-retry").onclick = load;
      if (!demo) {
        await ExicanAuth.renderAuthBar();
        await ExicanAuth.onAuthChange(async (event, session) => {
          version += 1;
          resetBoard();
          get("member-content").textContent = "";
          if (roleFromEmail(session?.user?.email, EXICAN_CONFIG) === "anon") {
            get("member-message").hidden = false;
            get("member-message").textContent = "팀 로그인 후 현황을 확인하세요";
          } else await load();
        });
        await ExicanAuth.requireTeam();
      }
      await load();
    });
  </script>
</body>
</html>
