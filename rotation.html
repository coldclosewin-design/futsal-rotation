<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>풋살 배정</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="styles.css?v=20261019a">
</head>
<body class="rollout-page">
  <h1>키퍼·휴식 배정</h1>

  <main class="rotation-page page-grid">
    <div id="rotation-member" class="identity-line page-wide"></div>
    <section class="board page-board" aria-label="배정 요약">
      <div class="board-row"><div><p class="label">키퍼·휴식 배정</p><p id="rotation-board-date" class="board-title">오늘</p></div><p id="rotation-count" class="display" aria-label="선택된 참가자 수">0</p></div>
      <div class="segments">
        <div class="segment"><span class="label">포맷</span><b id="rotation-format">5v5</b></div>
        <div id="rotation-min-segment" class="segment is-dim"><span class="label">최소 인원</span><b id="rotation-minimum">5명 필요</b></div>
        <div class="segment"><span class="label">연동 상태</span><b id="rotation-connection">확인 중</b></div>
      </div>
    </section>
  <div class="section page-wide" id="rotation-integration">
    <button type="button" id="load-attendees" disabled>이번 주 참석자 불러오기</button>
    <p id="rotation-notice" role="status">팀 연결을 확인하는 중입니다. 수동 배정은 그대로 사용할 수 있습니다.</p>
  </div>

  <div class="section">
    <h2>오늘 참가자 선택 <span id="minHint" class="meta">(5v5: 5명 이상, 6v6: 6명 이상)</span></h2>
    <div class="member-grid" id="memberGrid"></div>
    <div class="count-info" id="countInfo">0명 선택</div>
  </div>

  <div class="section hidden" id="partialSection">
    <details>
      <summary class="partial-heading">
        중간 이탈/늦참 설정 (선택 안 하면 전원 Q1~Q8 전체 참여)
      </summary>
      <div id="partialList" class="partial-list"></div>
      <p class="meta partial-hint">
        조기 퇴장자는 필드 위주 배치(GK·휴식 최소화), 나머지 인원이 더 자주 서게 됩니다.
      </p>
    </details>
  </div>

  <div class="section">
    <h2>포맷</h2>
    <div class="format-row">
      <label><input type="radio" name="format" value="5v5" checked><span>5 vs 5</span></label>
      <label><input type="radio" name="format" value="6v6"><span>6 vs 6</span></label>
    </div>
    <button class="primary" id="generateBtn" disabled>배정표 생성</button>
  </div>

  <div class="section hidden page-wide" id="resultSection">
    <h2>배정 결과 <span id="shuffleInfo" class="meta"></span></h2>
    <div class="result-scroll" role="region" aria-label="배정 결과표" tabindex="0"><table class="result-table" id="resultTable"></table></div>
    <div class="summary" id="summary"></div>
    <div id="warnings" class="meta rotation-warnings"></div>
    <div class="home-actions"><button class="secondary" id="shuffleBtn">다시 섞기</button><button class="primary" id="copyBtn">카톡에 복사</button></div>
    <div id="rotation-save" class="rows flat-rows" hidden>
      <label>저장할 매치<select id="rotation-match"></select></label>
      <div class="row"><span class="row-label">회장 저장</span><button type="button" class="row-action" id="save-rotation">이번 매치에 저장</button></div>
      <p id="rotation-save-message" role="status"></p>
    </div>
  </div>

  <nav class="rows page-wide" aria-label="멤버 관리 이동"><a id="rotation-admin-link" class="row" href="admin.html?tab=members"><span class="row-label">멤버 관리</span><span class="row-action">관리 화면</span></a></nav>
  </main>

  <div class="toast" id="toast"></div>

  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/member.js"></script>
  <script src="js/data.js"></script>
  <script src="js/attendance-rules.js"></script>
  <script src="js/data-admin.js"></script>
  <script src="js/rotation.js?v=4"></script>
  <script>
    renderNav("rotation");
    const LS_KEY = "futsal_members_override";
    const integration = { connected: false, admin: false, members: [], poll: null, matches: [], result: null, saving: false };
    let loadAttendees = null;
    const demo = ExicanData.mode() === "demo";
    const explicitDemo = new URLSearchParams(location.search).get("demo") === "1";
    if (demo) document.getElementById("rotation-admin-link").search = "?tab=members&demo=1";
    document.getElementById("shuffleBtn").innerHTML = `${icon("shuffle", 18)} 다시 섞기`;
    document.getElementById("copyBtn").innerHTML = `${icon("copy", 18)} 카톡에 복사`;
    function updateRotationBoard() {
      const count = document.querySelectorAll("#memberGrid input:checked").length;
      const format = document.querySelector('input[name="format"]:checked').value;
      const minimum = format === "5v5" ? 5 : 6;
      const match = integration.matches.find((row) => row.id === document.getElementById("rotation-match").value) || integration.matches[0];
      document.getElementById("rotation-count").textContent = count;
      document.getElementById("rotation-format").textContent = format;
      document.getElementById("rotation-minimum").textContent = count >= minimum ? "충족" : `${minimum}명 필요`;
      document.getElementById("rotation-min-segment").classList.toggle("is-dim", count < minimum);
      document.getElementById("rotation-connection").textContent = integration.connected ? "팀 연결" : "수동 배정";
      const boardDate = integration.connected ? match?.match_date || integration.poll?.match_date : null;
      document.getElementById("rotation-board-date").textContent = boardDate ? ExicanRules.pollTitle({ match_date: boardDate }).replace(" 경기", "").replace(/\((.)\)$/, " $1") : "오늘";
    }
    document.getElementById("rotation-match").addEventListener("change", updateRotationBoard);
    // TOTAL_QUARTERS는 rotation.js 에서 전역으로 선언되어 있으므로 여기서는 재선언 안 함

    async function loadMembers() {
      let role = "team";
      if (!demo) {
        await ExicanAuth.renderAuthBar();
        role = await ExicanAuth.requireTeam();
      }
      try {
        if ((demo && explicitDemo) || (!demo && ["team", "admin"].includes(role))) {
          const members = await ExicanData.members();
          if (!members.length) throw new Error("활동 멤버가 없습니다");
          integration.members = members;
          integration.connected = true;
          const [poll, matches] = await Promise.allSettled([ExicanData.currentPoll(), ExicanData.matches({ from: ExicanRules.kstDate(new Date()) })]);
          integration.poll = poll.status === "fulfilled" ? poll.value : null;
          integration.matches = matches.status === "fulfilled" ? matches.value.filter((row) => row.status === "scheduled") : [];
          integration.admin = demo ? members.some((member) => member.id === ExicanMember.getId() && member.is_president) : role === "admin";
          document.getElementById("load-attendees").disabled = false;
          document.getElementById("rotation-notice").textContent = demo ? "데모 투표와 매치에 연결되었습니다. 저장 결과는 새로고침하면 초기화됩니다." : "이번 주 투표 참석자를 불러올 수 있습니다.";
          if (demo) {
            // 다른 페이지와 같은 신원 줄: 저장된 이름이 있으면 뱃지, 없으면 선택 버튼
            const container = document.getElementById("rotation-member");
            const renderIdentity = () => {
              const current = members.find((member) => member.id === ExicanMember.getId());
              container.textContent = "";
              if (current) {
                integration.admin = current.is_president;
                ExicanMember.renderBadge(container, current, async () => {
                  ExicanMember.clear();
                  await ExicanMember.ensure(members);
                  renderIdentity();
                  await refreshSave();
                  await autoLoadAttendees();
                });
                return;
              }
              const button = document.createElement("button");
              button.type = "button"; button.className = "secondary"; button.textContent = "내 이름 선택";
              button.onclick = async () => {
                try { await ExicanMember.ensure(members); renderIdentity(); await refreshSave(); await autoLoadAttendees(); }
                catch (error) { showToast(error.message); }
              };
              container.appendChild(button);
            };
            renderIdentity();
          }
          return members;
        }
        document.getElementById("rotation-notice").textContent = "설정 전 또는 비로그인 상태입니다. 수동 배정은 사용할 수 있으며, 팀 로그인 후 새로고침하면 투표와 연동됩니다.";
      } catch (error) {
        integration.connected = false;
        document.getElementById("rotation-notice").textContent = `팀 명단 연결 실패: ${error.message}. 오프라인 명단으로 수동 배정합니다.`;
      }
      const override = localStorage.getItem(LS_KEY);
      if (override) {
        try {
          const parsed = JSON.parse(override);
          if (parsed && Array.isArray(parsed.members) && parsed.members.length > 0) {
            return parsed.members;
          }
        } catch (e) { /* fall through */ }
      }
      const res = await fetch("members.json", { cache: "no-cache" });
      const data = await res.json();
      return data.members;
    }

    function quarterOptions(selectedValue) {
      let html = "";
      for (let i = 1; i <= TOTAL_QUARTERS; i++) {
        html += `<option value="${i}" ${i === selectedValue ? "selected" : ""}>Q${i}</option>`;
      }
      return html;
    }

    async function autoLoadAttendees() {
      if (loadAttendees && integration.connected && integration.admin && integration.poll &&
          integration.matches.some((match) => match.poll_id === integration.poll.id)) {
        await loadAttendees(false);
      }
    }

    function render(members) {
      const grid = document.getElementById("memberGrid");
      grid.innerHTML = "";
      const selected = new Set();
      const partials = {};

      const rebuildPartialUI = () => {
        const wrap = document.getElementById("partialSection");
        const list = document.getElementById("partialList");
        const selectedMembers = members.filter((m) => selected.has(m.id));
        if (selectedMembers.length === 0) {
          wrap.classList.add("hidden");
          return;
        }
        wrap.classList.remove("hidden");
        list.innerHTML = "";
        for (const m of selectedMembers) {
          const cur = partials[m.id] || { start: 1, end: TOTAL_QUARTERS };
          partials[m.id] = cur;
          const row = document.createElement("div");
          row.className = "partial-row";
          row.innerHTML = `
            <span class="partial-name">${escapeHtml(m.name)}</span>
            <select data-id="${escapeHtml(m.id)}" data-kind="start">${quarterOptions(cur.start)}</select>
            <span class="partial-sep">~</span>
            <select data-id="${escapeHtml(m.id)}" data-kind="end">${quarterOptions(cur.end)}</select>
          `;
          list.appendChild(row);
        }
        list.querySelectorAll("select").forEach((sel) => {
          sel.addEventListener("change", () => {
            const id = sel.dataset.id;
            const kind = sel.dataset.kind;
            partials[id][kind] = parseInt(sel.value, 10);
            if (partials[id].start > partials[id].end) {
              if (kind === "start") partials[id].end = partials[id].start;
              else partials[id].start = partials[id].end;
              rebuildPartialUI();
            }
          });
        });
      };

      const updateCount = () => {
        const n = selected.size;
        const info = document.getElementById("countInfo");
        const btn = document.getElementById("generateBtn");
        const format = document.querySelector('input[name="format"]:checked').value;
        const minN = format === "5v5" ? 5 : 6;
        info.textContent = `${n}명 선택 (${format} 최소 ${minN}명)`;
        if (n >= minN) {
          info.classList.add("valid");
          info.classList.remove("invalid");
          btn.disabled = false;
        } else {
          info.classList.remove("valid");
          if (n > 0) info.classList.add("invalid");
          btn.disabled = true;
        }
        rebuildPartialUI();
        updateRotationBoard();
      };
      document.querySelectorAll('input[name="format"]').forEach((radio) => {
        radio.addEventListener("change", updateCount);
      });

      for (const m of members) {
        const label = document.createElement("label");
        label.className = "member-item";
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.value = m.id;
        cb.addEventListener("change", () => {
          if (cb.checked) {
            selected.add(m.id);
            label.classList.add("checked");
          } else {
            selected.delete(m.id);
            label.classList.remove("checked");
            delete partials[m.id];
          }
          updateCount();
        });
        const nameSpan = document.createElement("span");
        nameSpan.textContent = m.name;
        label.appendChild(cb);
        label.appendChild(nameSpan);
        grid.appendChild(label);
      }

      updateCount();
      let currentContext = null;
      loadAttendees = async (notify = true) => {
        const button = document.getElementById("load-attendees");
        button.disabled = true;
        try {
          const poll = await ExicanData.currentPoll();
          if (!poll || poll.cancelled) throw new Error("진행 가능한 이번 주 투표가 없습니다");
          integration.poll = poll;
          const names = new Set(ExicanAttendance.rosterFromVotes(await ExicanData.votes(poll.id), integration.members));
          for (const checkbox of grid.querySelectorAll("input")) {
            checkbox.checked = names.has(members.find((member) => member.id === checkbox.value)?.name);
            checkbox.dispatchEvent(new Event("change"));
          }
          if (notify) showToast(`참석 ${selected.size}명 선택`);
        } catch (error) {
          if (notify) showToast(error.message);
          else document.getElementById("rotation-notice").textContent = `참석자 자동 선택 실패: ${error.message}`;
        }
        finally { button.disabled = !integration.connected; }
      };
      document.getElementById("load-attendees").addEventListener("click", () => loadAttendees());

      const runAndRender = (offset) => {
        const { chosen, format, quartersMap } = currentContext;
        try {
          const schedule = buildSchedule(chosen, format, quartersMap, offset);
          const v = validateSchedule(schedule, chosen.length, format, quartersMap);
          if (!v.ok) {
            alert("배정 검증 실패:\n- " + v.errors.join("\n- ").replace(/\u2192/g, "~"));
            return;
          }
          currentContext.offset = offset;
          renderResult(schedule, chosen, format, v, quartersMap, offset);
          integration.result = { schedule, players: chosen, format };
          refreshSave().catch((error) => showToast(error.message));
        } catch (e) {
          alert(e.message);
        }
      };

      document.getElementById("generateBtn").addEventListener("click", () => {
        const chosenMembers = members.filter((m) => selected.has(m.id));
        const chosen = chosenMembers.map((m) => m.name);
        const format = document.querySelector('input[name="format"]:checked').value;
        const quartersMap = {};
        for (const m of chosenMembers) {
          const p = partials[m.id];
          if (p && (p.start > 1 || p.end < TOTAL_QUARTERS)) {
            quartersMap[m.name] = { start: p.start, end: p.end };
          }
        }
        currentContext = { chosen, format, quartersMap, offset: 0 };
        runAndRender(0);
      });

      document.getElementById("shuffleBtn").addEventListener("click", () => {
        if (!currentContext) return;
        runAndRender(currentContext.offset + 1);
      });
    }

    function renderResult(schedule, players, format, v, quartersMap, offset) {
      const section = document.getElementById("resultSection");
      section.classList.remove("hidden");
      const info = document.getElementById("shuffleInfo");
      info.textContent = offset > 0 ? `(${offset}번 다시 섞음)` : "";
      const table = document.getElementById("resultTable");
      const hasRest = schedule.some((q) => q.rest.length > 0);
      let html = `<tr><th>쿼터</th><th>키퍼</th>${hasRest ? "<th>휴식</th>" : ""}<th>필드</th></tr>`;
      for (const q of schedule) {
        html += `<tr>
          <th>Q${q.quarter}</th>
          <td class="gk">${escapeHtml(q.gk)}</td>
          ${hasRest ? `<td class="rest">${escapeHtml(q.rest.join(", ") || "-")}</td>` : ""}
          <td>${escapeHtml(q.field.join(", "))}</td>
        </tr>`;
      }
      table.innerHTML = html;

      const gkSummary = players.map((p) => `${p}${v.gkCount[p] || 0}`).join(" · ");
      let summaryHtml = `키퍼 총 횟수: ${escapeHtml(gkSummary)}`;
      if (hasRest) {
        const restSummary = players.map((p) => `${p}${v.restCount[p] || 0}`).join(" · ");
        summaryHtml += `<br>휴식 총 횟수: ${escapeHtml(restSummary)}`;
      }
      const limited = Object.entries(quartersMap || {});
      if (limited.length) {
        const tags = limited.map(([n, r]) => `${n}(Q${r.start}~${r.end})`).join(", ");
        summaryHtml += `<br>부분 참여: ${escapeHtml(tags)}`;
      }
      document.getElementById("summary").innerHTML = summaryHtml;

      const warnBox = document.getElementById("warnings");
      if (v.warnings && v.warnings.length) {
        warnBox.textContent = "주의: " + v.warnings.join(" / ");
      } else {
        warnBox.innerHTML = "";
      }

      const copyBtn = document.getElementById("copyBtn");
      copyBtn.onclick = async () => {
        const text = formatForKakao(schedule, format, players, quartersMap);
        try {
          await navigator.clipboard.writeText(text);
          showToast("복사됨! 카톡에 붙여넣기");
        } catch (e) {
          prompt("복사가 지원되지 않습니다. 아래 텍스트를 수동 복사하세요:", text);
        }
      };

      section.scrollIntoView({ behavior: "smooth" });
    }

    function showFatal(msg) {
      const box = document.createElement("div");
      box.className = "fatal";
      box.setAttribute("role", "alert");
      box.textContent = "진단: " + msg;
      document.body.insertBefore(box, document.body.firstChild);
    }
    window.addEventListener("error", (e) => showFatal("JS 에러: " + e.message + " @ " + (e.filename || "?") + ":" + e.lineno));

    async function refreshSave() {
      document.getElementById("rotation-save").hidden = !integration.admin || !integration.result;
      if (!integration.admin || !integration.result) return;
      integration.poll = await ExicanData.currentPoll();
      integration.matches = (await ExicanData.matches({ from: ExicanRules.kstDate(new Date()) })).filter((match) => match.status === "scheduled");
      const select = document.getElementById("rotation-match");
      const selected = select.value || integration.matches.find((match) => match.match_date === integration.poll?.match_date)?.id;
      select.innerHTML = integration.matches.map((match) => `<option value="${escapeHtml(match.id)}" ${match.id === selected ? "selected" : ""}>${escapeHtml(match.match_date)} ${escapeHtml(match.start_time.slice(0, 5))} · ${escapeHtml(match.venue || "구장 미정")}</option>`).join("");
      updateRotationBoard();
      document.getElementById("save-rotation").disabled = !integration.matches.length;
      document.getElementById("rotation-save-message").textContent = integration.matches.length ? "생성한 배정표를 선택한 매치에 저장합니다." : "저장할 예정 매치가 없습니다.";
    }

    document.getElementById("save-rotation").addEventListener("click", async () => {
      if (integration.saving || !integration.result) return;
      const id = document.getElementById("rotation-match").value;
      const result = integration.result;
      integration.saving = true;
      document.getElementById("save-rotation").disabled = true;
      try {
        const rows = ExicanAttendance.rotationRows(result.schedule, result.players, integration.members);
        await ExicanData.saveRotationHistory(id, rows);
        try { await ExicanData.updateMatch(id, { schedule: result.schedule }); }
        catch (error) { throw new Error(`개인 배정 기록은 저장되었습니다. 매치 배정표 저장을 다시 시도하세요: ${error.message}`); }
        await Promise.all([ExicanData.rotationHistory({ matchId: id }), ExicanData.matches()]);
        document.getElementById("rotation-save-message").textContent = "배정표와 개인 배정 기록을 저장했습니다";
        showToast("이번 매치에 저장했습니다");
      } catch (error) { document.getElementById("rotation-save-message").textContent = error.message; showToast(error.message); }
      finally { integration.saving = false; document.getElementById("save-rotation").disabled = false; }
    });

    if (!demo) ExicanAuth.onAuthChange(async () => {
      const role = await ExicanAuth.getRole();
      const wasAdmin = integration.admin;
      integration.admin = role === "admin";
      integration.connected = ["team", "admin"].includes(role) && integration.members.length > 0;
      document.getElementById("load-attendees").disabled = !integration.connected;
      document.getElementById("rotation-save").hidden = !integration.admin || !integration.result;
      if (!integration.admin) document.getElementById("rotation-match").textContent = "";
      updateRotationBoard();
      if (!wasAdmin && integration.admin) await autoLoadAttendees();
    }).catch((error) => { document.getElementById("rotation-notice").textContent = error.message; });

    loadMembers()
      .then(async (members) => {
        if (!Array.isArray(members)) { showFatal("members가 배열이 아님: " + typeof members); return; }
        if (members.length === 0) { showFatal("members가 빈 배열. localStorage 또는 members.json 확인 필요."); return; }
        try { render(members); await autoLoadAttendees(); }
        catch (e) { showFatal("render 에러: " + e.message + "\n" + (e.stack || "")); }
      })
      .catch((e) => showFatal("loadMembers 실패: " + e.message));
  </script>
</body>
</html>
