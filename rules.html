<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>회칙 · FC EXICAN</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>FC EXICAN 회칙</h1>

  <main class="rules-page">
    <section class="section" aria-labelledby="rules-summary-title">
      <h2 id="rules-summary-title">벌금·회비 한눈에</h2>
      <div class="rules-table-scroll" role="region" aria-labelledby="rules-summary-title" tabindex="0">
        <table class="rules-table">
          <thead>
            <tr><th scope="col">항목</th><th scope="col">금액</th><th scope="col">기준</th></tr>
          </thead>
          <tbody id="rules-fees"></tbody>
        </table>
      </div>
      <p class="rules-table-hint">표가 화면보다 넓으면 좌우로 밀어 확인하세요.</p>
    </section>

    <article id="rules-content" class="rules-document" aria-label="회칙 전문" aria-busy="true">
      <p role="status">회칙을 불러오는 중입니다.</p>
    </article>
    <noscript><p>회칙을 보려면 JavaScript를 켜거나 <a href="docs/rules.md">회칙 원문</a>을 확인하세요.</p></noscript>

    <aside class="rules-notice">회칙 개정 제안은 매월 24일까지 운영위원장에게</aside>
    <section class="section" aria-labelledby="history-title">
      <h2 id="history-title">경기 기록</h2>
      <button type="button" id="load-history">불러오기(팀 로그인)</button>
      <p id="history-message" role="status">팀 로그인 후 경기 기록을 확인할 수 있습니다.</p>
      <div id="match-history"></div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/markdown-lite.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/member.js"></script>
  <script src="js/data.js"></script>
  <script src="js/attendance-rules.js"></script>
  <script src="js/data-admin.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      renderNav("rules");
      const demo = ExicanData.mode() === "demo";
      if (demo) document.querySelectorAll(".topnav a").forEach((link) => { link.search = "?demo=1"; });
      let historyVersion = 0;
      document.getElementById("load-history").onclick = async () => {
        const button = document.getElementById("load-history");
        const message = document.getElementById("history-message");
        const request = ++historyVersion;
        button.disabled = true;
        try {
          if (!demo) {
            await ExicanAuth.requireTeam();
            if (!["team", "admin"].includes(await ExicanAuth.getRole())) throw new Error("팀 로그인이 필요합니다");
          }
          const rows = await ExicanData.matchHistory();
          if (request !== historyVersion) return;
          const e = escapeHtml;
          document.getElementById("match-history").innerHTML = rows.length ? `<div class="operations-scroll" role="region" aria-label="경기 기록 표" tabindex="0"><table class="operations-table"><thead><tr>${["날짜", "구장", "상대", "포맷", "스코어", "참석 수", "상태"].map((label) => `<th scope="col">${label}</th>`).join("")}</tr></thead><tbody>${rows.map((row) => `<tr><th scope="row">${e(row.match_date)}</th><td>${e(row.venue || "—")}</td><td>${e(row.opponent || "—")}</td><td>${e(row.format || "—")}</td><td>${row.score_us == null || row.score_them == null ? "—" : `${e(row.score_us)}:${e(row.score_them)}`}</td><td>${row.attendance_count}명</td><td>${e(ExicanAttendance.MATCH_LABELS[row.status])}</td></tr>`).join("")}</tbody></table></div>` : "";
          message.textContent = rows.length ? `최근 ${rows.length}경기 · 표를 좌우로 밀어 확인하세요.` : "경기 기록이 없습니다.";
        } catch (error) { message.textContent = error.message; }
        finally { button.disabled = false; }
      };
      // 회칙 본문은 인증 초기화나 로그인 성공을 기다리지 않는다.
      if (!demo) ExicanAuth.onAuthChange((event, session) => {
        if (roleFromEmail(session?.user?.email, EXICAN_CONFIG) === "anon") {
          historyVersion += 1;
          document.getElementById("match-history").textContent = "";
          document.getElementById("history-message").textContent = "팀 로그인 후 경기 기록을 확인할 수 있습니다.";
        }
      }).catch(() => {});

      const { FINES, DUES_MONTHLY, INJURY_EXEMPT_RATE } = EXICAN_CONFIG;
      const fees = [
        ["월 회비", DUES_MONTHLY, "매월 1일 납부 (카카오 정산)"],
        ["부상자 면제 후 회비", DUES_MONTHLY * (1 - INJURY_EXEMPT_RATE), "4주 이상 경기 불가한 부상 · 증빙 필요"],
        ["투표 미참여", FINES.LATE_VOTE, "월요일 13시 마감까지 미투표"],
        ["참석 후 급불참", FINES.NO_SHOW, "개인 사유로 불참 (애사 예외는 아래 회칙 참고)"],
        ["지각(15분 전 미도착)", FINES.LATE, "경기 시작 15분 전까지 미도착"],
        ["경기 시작 후 도착", FINES.LATE_KICKOFF, "경기 시작 이후 도착"]
      ];
      const tbody = document.getElementById("rules-fees");
      for (const [label, amount, criteria] of fees) {
        const row = document.createElement("tr");
        for (const [index, text] of [label, formatWon(amount), criteria].entries()) {
          const cell = document.createElement(index === 0 ? "th" : "td");
          if (index === 0) cell.scope = "row";
          cell.textContent = text;
          row.appendChild(cell);
        }
        tbody.appendChild(row);
      }

      const content = document.getElementById("rules-content");
      try {
        const response = await fetch("docs/rules.md");
        if (!response.ok) throw new Error("회칙을 불러오지 못했습니다.");
        content.innerHTML = renderMarkdownLite(await response.text());
      } catch (error) {
        content.innerHTML = "<p role=\"alert\">회칙을 불러오지 못했습니다. 잠시 후 새로고침하거나 <a href=\"docs/rules.md\">회칙 원문</a>을 확인하세요.</p>";
      } finally {
        content.setAttribute("aria-busy", "false");
      }
    });
  </script>
</body>
</html>
