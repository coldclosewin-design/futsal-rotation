<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FC EXICAN 운영 허브</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="styles.css?v=20261017a">
</head>
<body class="home-page">
  <h1>FC EXICAN 운영 허브</h1>
  <main>
    <div class="bed">
      <section class="board home-board" aria-label="이번 주 상태">
        <div class="board-row">
          <div>
            <p class="label">이번 주</p>
            <p id="home-week-date" class="board-title">확인 중</p>
          </div>
          <p id="home-dday" class="display" aria-label="경기까지 남은 날">—</p>
        </div>
        <div class="segments" aria-hidden="true">
          <div class="segment is-dim" id="seg-poll"><span class="label">투표</span><b>확인 중</b></div>
          <div class="segment is-dim" id="seg-match"><span class="label">매치</span><b>확인 중</b></div>
        </div>
        <div class="board-lines">
          <p id="home-match" class="board-line" aria-live="polite">확정 매치를 불러오는 중입니다…</p>
        </div>
        <p id="home-week" class="ledger-sr-only" role="status">이번 주 일정을 확인하는 중입니다…</p>
      </section>
    </div>
    <div class="hub-grid">
      <section class="card" aria-labelledby="home-poll-title">
        <h2 id="home-poll-title">이번 주 투표</h2>
        <p class="home-number"><span id="home-poll-count">—</span><small>명 참석</small></p>
        <p id="weekly-poll-summary" class="home-meta" aria-live="polite">투표를 불러오는 중입니다…</p>
        <div class="home-actions">
          <a id="weekly-poll-link" class="button primary" href="vote.html">투표하기</a>
          <button id="share-vote" class="home-share" type="button" disabled>링크 복사</button>
        </div>
        <a id="home-special-polls" class="row special-poll-link" href="vote.html" hidden></a>
      </section>
      <section class="card" aria-labelledby="home-candidates-title">
        <h2 id="home-candidates-title">매칭 후보</h2>
        <div id="home-candidates" aria-live="polite"><p class="home-meta">후보를 불러오는 중입니다…</p></div>
        <div class="home-actions">
          <a class="button" href="matches.html">전체 보기</a>
          <button id="share-candidates" class="home-share" type="button" disabled>후보 공유</button>
        </div>
      </section>
      <nav class="rows" aria-label="바로 가기">
        <a id="home-rotation-link" class="row" href="rotation.html">
          <span class="row-main"><span class="row-label">배정표</span><span class="row-sub">이번 주 참석자로 키퍼·휴식 배정</span></span>
          <span class="row-end"><span class="row-action">배정표 만들기</span></span>
        </a>
        <a id="ledger-link" class="row" href="ledger.html">
          <span class="row-main"><span class="row-label">장부</span><span id="ledger-summary" class="row-sub" aria-live="polite">장부를 불러오는 중입니다…</span><span id="ledger-my-summary" class="row-sub ledger-home-mine" hidden></span></span>
          <span class="row-end"><span id="home-balance" class="row-figure">—</span></span>
        </a>
        <a id="home-member-link" class="row" href="member.html">
          <span class="row-main"><span class="row-label">내 현황</span><span id="home-member-summary" class="row-sub">내 납부·벌금·참석률과 키퍼·휴식 기록</span></span>
          <span class="row-end"><span class="row-action">보기</span></span>
        </a>
      </nav>
    </div>
    <button id="home-retry" class="secondary" type="button" hidden>홈 정보 다시 불러오기</button>
  </main>
  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/ui.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/data.js"></script>
  <script src="js/member.js"></script>
  <script src="js/candidates.js"></script>
  <script src="js/ledger-rules.js"></script>
  <script src="js/data-ledger.js"></script>
  <script src="js/share.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      renderNav("home");
      const demo = ExicanData.mode() === "demo";
      const get = (id) => document.getElementById(id);
      let version = 0, role = "anon";
      let poll = null, weeklyPoll = null, pollSummary = null, ranked = [], nextMatch = null, confirmedDates = [];
      let pollState = "loading", matchState = "loading";
      const pageUrl = (page) => {
        const url = new URL(page, location.href);
        if (demo) url.searchParams.set("demo", "1");
        return url.href;
      };
      if (demo) {
        document.querySelectorAll("a[href$='.html']").forEach((link) => { link.search = "?demo=1"; });
      }

      function updateWeek() {
        const now = new Date().toISOString();
        const today = ExicanRules.kstDate(now);
        const saturday = ExicanRules.nextSaturday(today);
        const days = Math.round((Date.parse(`${saturday}T00:00:00Z`) - Date.parse(`${today}T00:00:00Z`)) / 86400000);
        const date = saturday.slice(5).split("-").map(Number).join("/");
        const status = pollState === "ready" ? poll?.match_date === saturday ?
          { scheduled: "예정", open: "진행 중", closed: "마감", cancelled: "취소" }[ExicanRules.pollStatus(poll, now)] : "없음" :
          pollState === "signed-out" ? "로그인 필요" : pollState === "error" ? "확인 필요" : "확인 중";
        const confirmed = matchState === "ready" ? confirmedDates.includes(saturday) ? "확정" : "없음" :
          matchState === "signed-out" ? "로그인 필요" : matchState === "error" ? "확인 필요" : "확인 중";
        get("home-week").textContent = `이번 주 ${date}(토) ${days ? `D-${days}` : "D-day"} · 투표 ${status} · 매치 ${confirmed}`;
        get("home-week-date").textContent = `${date} 토`;
        get("home-dday").textContent = days ? `D-${days}` : "D-day";
        const segment = (id, text, lit, dim) => {
          const node = get(id);
          node.querySelector("b").textContent = text;
          node.classList.toggle("is-lit", Boolean(lit));
          node.classList.toggle("is-dim", Boolean(dim) && !lit);
        };
        // 점등은 "지금 할 일이 있는 것"에만: 진행 중인 투표, 경기 3일 전인데 매치가 없을 때
        segment("seg-poll", status, status === "진행 중", ["없음", "확인 중", "로그인 필요", "확인 필요"].includes(status));
        segment("seg-match", confirmed, confirmed === "없음" && days <= 3 && pollState === "ready", ["확인 중", "로그인 필요", "확인 필요"].includes(confirmed));
      }

      function resetPrivate(message) {
        version += 1;
        poll = null; weeklyPoll = null; pollSummary = null; ranked = []; nextMatch = null; confirmedDates = [];
        pollState = "signed-out"; matchState = "signed-out";
        for (const id of ["weekly-poll-summary", "home-candidates", "home-match", "ledger-summary"]) get(id).textContent = message;
        for (const id of ["home-poll-count", "home-balance"]) get(id).textContent = "—";
        for (const id of ["ledger-my-summary", "home-special-polls"]) { get(id).textContent = ""; get(id).hidden = true; }
        get("home-member-summary").textContent = "팀 로그인 후 내 기록을 확인하세요.";
        get("ledger-summary").classList.remove("lit-dot");
        get("home-member-link").href = pageUrl("member.html");
        get("home-rotation-link").querySelector(".row-action").textContent = "배정표 만들기";
        get("share-vote").disabled = true;
        get("share-candidates").disabled = true;
        get("home-retry").hidden = true;
        updateWeek();
      }

      async function loadHome() {
        if (!demo && role === "anon") return;
        const request = ++version;
        const today = ExicanRules.kstDate(new Date());
        get("home-retry").hidden = true;
        get("home-retry").disabled = true;
        get("share-vote").disabled = true;
        get("share-candidates").disabled = true;
        pollState = "loading"; matchState = "loading";
        updateWeek();
        const membersRequest = ExicanData.members();
        const pollRequest = ExicanData.upcomingPolls().then(async (upcoming) => {
          // 정기(토요일) 투표가 없으면 가장 가까운 투표를 카드에 보여준다
          const regular = upcoming.find((row) => !ExicanRules.isSpecialPoll(row)) || upcoming[0] || null;
          const [votes, members] = await Promise.all([regular ? ExicanData.votes(regular.id) : [], membersRequest]);
          return { poll: upcoming[0] || null, weeklyPoll: regular, upcoming,
            summary: regular ? ExicanRules.attendanceSummary(votes, members) : null };
        });
        const results = await Promise.allSettled([
          pollRequest,
          ExicanData.candidates({ from: demo ? undefined : today, includeClosed: true }),
          ExicanData.matches({ from: demo ? undefined : today }),
          ExicanData.ledgerRange(),
          membersRequest
        ]);
        if (request !== version) return;
        const [ballot, candidates, matches, ledger, members] = results;
        pollState = ballot.status === "fulfilled" ? "ready" : "error";
        poll = ballot.status === "fulfilled" ? ballot.value.poll : null;
        weeklyPoll = ballot.status === "fulfilled" ? ballot.value.weeklyPoll : null;
        pollSummary = ballot.status === "fulfilled" ? ballot.value.summary : null;
        get("home-poll-title").textContent = weeklyPoll ? ExicanRules.pollTitle(weeklyPoll) + " 투표" : "이번 주 투표";
        if (weeklyPoll) {
          const deadline = new Date(weeklyPoll.closes_at).toLocaleString("ko-KR", { timeZone: "Asia/Seoul", month: "numeric", day: "numeric", weekday: "short", hour: "2-digit", minute: "2-digit", hour12: false });
          const status = { scheduled: "예정", open: "진행 중", closed: "마감됨", cancelled: "취소됨" }[ExicanRules.pollStatus(weeklyPoll, new Date().toISOString())];
          get("home-poll-count").textContent = String(pollSummary.count);
          get("weekly-poll-summary").textContent = `마감 ${deadline} · ${status}`;
        } else {
          get("home-poll-count").textContent = "—";
          get("weekly-poll-summary").textContent = pollState === "error" ? "투표를 불러오지 못했습니다. 다시 시도하세요." : "아직 열린 투표가 없습니다. 일요일 13:00에 자동 생성됩니다.";
        }
        get("share-vote").disabled = pollState !== "ready";
        const upcoming = ballot.status === "fulfilled" ? ballot.value.upcoming : [];
        const specials = upcoming.filter((row) => ExicanRules.isSpecialPoll(row) && row.id !== weeklyPoll?.id);
        const specialLink = get("home-special-polls");
        specialLink.hidden = upcoming.length < 2 || !specials.length;
        const specialTitle = specials.length ? specials[0].title ? `${specials[0].match_date.slice(5).split("-").map(Number).join("/")} ${specials[0].title}` : ExicanRules.pollTitle(specials[0]) : "";
        specialLink.textContent = specials.length ? `특별 투표 ${specials.length}개 · ${specialTitle}` : "";

        const candidateCard = get("home-candidates");
        candidateCard.textContent = "";
        ranked = [];
        if (candidates.status === "fulfilled") {
          const rows = demo ? ExicanCandidates.shiftDemoDates(candidates.value, today) : candidates.value;
          ranked = ExicanCandidates.filterCandidates(rows, { ...ExicanCandidates.DEFAULT_FILTERS,
            staleHours: EXICAN_CONFIG.CANDIDATE_STALE_HOURS }, today, new Date().toISOString()).ranked.slice(0, 3);
          if (!ranked.length) candidateCard.textContent = "이번 주 토요일 오전 후보가 아직 없습니다";
          else {
            const list = document.createElement("ol");
            list.className = "home-candidate-list";
            for (const row of ranked) {
              const item = document.createElement("li");
              const date = document.createElement("span");
              date.textContent = ExicanCandidates.describeSchedule(row);
              const link = document.createElement("a");
              link.href = EXICAN_CONFIG.CAFE.ARTICLE_URL(row.article_id, row.menu_id);
              link.target = "_blank"; link.rel = "noopener";
              link.textContent = row.subject;
              item.append(date, link); list.appendChild(item);
            }
            candidateCard.appendChild(list);
          }
          get("share-candidates").disabled = false;
        } else candidateCard.textContent = "후보를 불러오지 못했습니다. 다시 시도하세요.";

        matchState = matches.status === "fulfilled" ? "ready" : "error";
        nextMatch = null; confirmedDates = [];
        if (matches.status === "fulfilled") {
          const rows = demo ? ExicanCandidates.shiftDemoDates(matches.value, today) : matches.value;
          confirmedDates = rows.filter((row) => row.status === "scheduled").map((row) => row.match_date);
          nextMatch = rows.filter((row) => row.match_date >= today && row.status === "scheduled")
            .sort((a, b) => `${a.match_date}${a.start_time}`.localeCompare(`${b.match_date}${b.start_time}`))[0] || null;
          get("home-match").textContent = "확정된 매치가 없습니다";
          if (nextMatch) {
            const link = document.createElement("a");
            link.id = "home-match-link";
            link.href = pageUrl("matches.html#confirmed-matches");
            link.textContent = ExicanCandidates.describeMatch(nextMatch);
            const hint = document.createElement("span");
            hint.className = "board-link-hint";
            hint.textContent = "상세";
            link.appendChild(hint);
            get("home-match").replaceChildren(link);
          }
        } else get("home-match").textContent = "확정 매치를 불러오지 못했습니다. 다시 시도하세요.";
        get("home-rotation-link").querySelector(".row-action").textContent = nextMatch ? `${nextMatch.match_date.slice(5).split("-").map(Number).join("/")} 배정표 만들기` : "배정표 만들기";

        const month = ExicanLedgerRules.monthOf(today);
        const mine = get("ledger-my-summary");
        mine.hidden = true; mine.textContent = "";
        if (ledger.status === "fulfilled") {
          const team = ExicanLedgerRules.teamSummary(ledger.value, month);
          const unpaid = team.unpaidMembers.reduce((sum, row) => sum + row.outstanding, 0);
          get("home-balance").textContent = formatWon(team.balance);
          get("ledger-summary").textContent = team.unpaidMembers.length
            ? `이번 달 미납 ${team.unpaidMembers.length}명 · ${formatWon(unpaid)}`
            : "이번 달 미납 없음";
          // 점등: 주의할 것이 있을 때만
          get("ledger-summary").classList.toggle("lit-dot", team.unpaidMembers.length > 0);
          const personal = ExicanLedgerRules.memberSummary(ledger.value, ExicanMember.getId(), month);
          mine.hidden = !ExicanMember.getId() || personal.outstanding <= 0;
          if (!mine.hidden) mine.textContent = `내 미납 ${formatWon(personal.outstanding)}`;
        } else { get("home-balance").textContent = "—"; get("ledger-summary").textContent = "장부를 불러오지 못했습니다. 다시 시도하세요."; get("ledger-summary").classList.remove("lit-dot"); }
        const person = members.status === "fulfilled" && members.value.find((row) => row.id === ExicanMember.getId());
        const memberUrl = new URL(pageUrl("member.html"));
        if (person) memberUrl.searchParams.set("id", person.id);
        get("home-member-link").href = memberUrl.href;
        get("home-member-summary").textContent = person ? `${person.name} · 납부·벌금·참석률·키퍼 기록` : "내 이름을 선택하면 납부·벌금·참석률을 보여줍니다";
        get("home-retry").hidden = !results.some((result) => result.status === "rejected");
        get("home-retry").disabled = false;
        updateWeek();
      }

      // 네트워크 조회를 클릭 안에서 기다리지 않는다. 사용자 동작 중 바로 복사한다.
      async function copyShare(text) {
        try {
          await navigator.clipboard.writeText(text);
          showToast("복사했습니다. 카톡에 붙여넣어 주세요.");
        } catch (error) {
          prompt("복사가 지원되지 않습니다. 아래 문구를 복사해 주세요:", text);
        }
      }
      get("share-vote").onclick = () => copyShare(ExicanShare.buildVoteShare(weeklyPoll, pollSummary, pageUrl("vote.html")));
      get("share-candidates").onclick = () => copyShare(ExicanShare.buildCandidateShare(ranked, pageUrl("matches.html")));
      get("home-retry").onclick = () => loadHome().catch((error) => showToast(error.message));
      try {
        if (!demo) {
          role = await ExicanAuth.requireTeam();
          await ExicanAuth.onAuthChange(async (event, session) => {
            const nextRole = roleFromEmail(session?.user?.email, EXICAN_CONFIG);
            if (nextRole === role) return;
            role = nextRole;
            if (role === "anon") resetPrivate("팀 로그인 후 확인하세요.");
            else await loadHome();
          });
        }
        await loadHome();
      } catch (error) {
        resetPrivate("홈 정보를 불러오지 못했습니다. 새로고침해 주세요.");
        showToast(error.message);
      }
      updateWeek();
      setInterval(updateWeek, 60000);
    });
  </script>
</body>
</html>
