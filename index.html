<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>⚽ FC EXICAN 운영 허브</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>⚽ FC EXICAN 운영 허브</h1>

  <main>
    <div class="hub-grid">
      <section class="card">
        <h2>이번 주 투표</h2>
        <p id="weekly-poll-summary" aria-live="polite">투표를 불러오는 중입니다…</p>
        <a id="weekly-poll-link" href="vote.html">투표 페이지로</a>
      </section>
      <section class="card">
        <h2>매칭 후보</h2>
        <div id="home-candidates" aria-live="polite"><p>후보를 불러오는 중입니다…</p></div>
        <a href="matches.html">전체 보기 →</a>
      </section>
      <section class="card">
        <h2>확정 매치</h2>
        <p id="home-match" aria-live="polite">확정 매치를 불러오는 중입니다…</p>
        <p id="home-created-match" hidden></p>
        <a href="matches.html">확정 매치 보기</a>
      </section>
      <section class="card">
        <h2>장부 요약</h2>
        <p id="ledger-summary" aria-live="polite">장부를 불러오는 중입니다…</p>
        <p id="ledger-my-summary" class="ledger-home-mine" hidden></p>
        <a id="ledger-link" href="ledger.html">장부 페이지로</a>
      </section>
    </div>
    <button id="home-matches-retry" class="secondary" type="button" hidden>매칭 정보 다시 시도</button>
    <a class="hub-rotation-link" href="rotation.html">배정표 만들기</a>
  </main>

  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/ui.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/data.js"></script>
  <script src="js/member.js"></script>
  <script src="js/candidates.js"></script>
  <script src="js/ledger-rules.js"></script>
  <script src="js/data-ledger.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      renderNav("home");
      const demo = ExicanData.mode() === "demo";
      const summary = document.getElementById("weekly-poll-summary");
      const candidateCard = document.getElementById("home-candidates");
      const matchCard = document.getElementById("home-match");
      const createdCard = document.getElementById("home-created-match");
      const retryMatches = document.getElementById("home-matches-retry");
      let dashboardVersion = 0;
      let handedMatch = null;
      if (demo) {
        document.querySelectorAll('.topnav a[href="index.html"], a[href="vote.html"]').forEach((link) => { link.search = "?demo=1"; });
        document.querySelectorAll("a[href='matches.html']").forEach((link) => { link.search = "?demo=1"; });
        try {
          const saved = sessionStorage.getItem("exican_demo_match_handoff");
          sessionStorage.removeItem("exican_demo_match_handoff");
          const value = saved ? JSON.parse(saved) : null;
          if (value && /^demo-match-/.test(value.id) && /^\d{4}-\d{2}-\d{2}$/.test(value.match_date) && typeof value.start_time === "string") handedMatch = value;
        } catch (error) { /* 전달 데이터가 없거나 만료되면 기본 픽스처를 표시한다. */ }
      }
      async function loadDashboard() {
        const request = ++dashboardVersion;
        const today = ExicanRules.kstDate(new Date());
        retryMatches.hidden = true;
        const results = await Promise.allSettled([
          ExicanData.candidates({ from: demo ? undefined : today, includeClosed: true }),
          ExicanData.matches({ from: demo ? undefined : today })
        ]);
        if (request !== dashboardVersion) return;
        const [candidates, matches] = results;
        candidateCard.textContent = "";
        if (candidates.status === "fulfilled") {
          const rows = demo ? ExicanCandidates.shiftDemoDates(candidates.value, today) : candidates.value;
          const ranked = ExicanCandidates.filterCandidates(rows, ExicanCandidates.DEFAULT_FILTERS, today).ranked.slice(0, 3);
          if (!ranked.length) candidateCard.textContent = "이번 주 토요일 오전 후보가 아직 없습니다";
          else {
            const list = document.createElement("ul");
            list.className = "home-candidate-list";
            for (const row of ranked) {
              const item = document.createElement("li");
              const date = document.createElement("span");
              date.textContent = ExicanCandidates.describeSchedule(row);
              const link = document.createElement("a");
              link.href = EXICAN_CONFIG.CAFE.ARTICLE_URL(row.article_id, row.menu_id);
              link.target = "_blank";
              link.rel = "noopener";
              link.textContent = row.subject;
              item.append(date, link);
              list.appendChild(item);
            }
            candidateCard.appendChild(list);
          }
        } else {
          candidateCard.textContent = "후보를 불러오지 못했습니다";
          retryMatches.hidden = false;
        }
        createdCard.hidden = true;
        if (matches.status === "fulfilled") {
          let rows = demo ? ExicanCandidates.shiftDemoDates(matches.value, today) : matches.value;
          if (demo && handedMatch) rows = rows.filter((row) => row.id !== handedMatch.id).concat(handedMatch);
          rows = rows.filter((row) => row.match_date >= today && row.status === "scheduled")
            .sort((a, b) => `${a.match_date}${a.start_time}`.localeCompare(`${b.match_date}${b.start_time}`));
          matchCard.textContent = rows.length ? ExicanCandidates.describeMatch(rows[0]) : "확정된 매치가 없습니다";
          if (demo && handedMatch && rows[0]?.id !== handedMatch.id) {
            createdCard.hidden = false;
            createdCard.textContent = `방금 등록: ${ExicanCandidates.describeMatch(handedMatch)}`;
          }
        } else {
          matchCard.textContent = "확정 매치를 불러오지 못했습니다";
          retryMatches.hidden = false;
        }
      }
      retryMatches.addEventListener("click", loadDashboard);
      async function loadSummary() {
        const [poll, members] = await Promise.all([ExicanData.currentPoll(), ExicanData.members()]);
        if (!poll) {
          summary.textContent = "아직 열린 투표가 없습니다. 일요일 13:00에 자동 생성됩니다.";
          return;
        }
        const votes = await ExicanData.votes(poll.id);
        const { count } = ExicanRules.attendanceSummary(votes, members);
        const date = ExicanRules.kstDate(poll.closes_at).slice(5).replace("-", "/");
        const status = ExicanRules.pollStatus(poll, new Date().toISOString());
        summary.textContent = `참석 ${count}명 · 마감 ${date}(월) 13:00${status === "cancelled" ? " · 취소됨" : status === "closed" ? " · 마감됨" : ""}`;
      }
      try {
        try { await ExicanAuth.renderAuthBar(); }
        catch (error) { if (!demo) throw error; }
        if (!demo) await ExicanAuth.requireTeam();
        await loadSummary();
        await loadDashboard();
        if (!demo) await ExicanAuth.onAuthChange(async (event, session) => {
          if (roleFromEmail(session?.user?.email, EXICAN_CONFIG) === "anon") summary.textContent = "팀 로그인 후 투표를 확인하세요";
          else await loadSummary();
          if (roleFromEmail(session?.user?.email, EXICAN_CONFIG) === "anon") {
            dashboardVersion += 1;
            candidateCard.textContent = "팀 로그인 후 후보를 확인하세요";
            matchCard.textContent = "팀 로그인 후 매치를 확인하세요";
            createdCard.hidden = true;
            retryMatches.hidden = true;
          } else await loadDashboard();
        });
      } catch (error) {
        summary.textContent = "투표를 불러오지 못했습니다. 새로고침해 주세요.";
        showToast(error.message);
        candidateCard.textContent = "매칭 정보를 불러오지 못했습니다";
        matchCard.textContent = "매칭 정보를 불러오지 못했습니다";
      }
    });
  </script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const demo = ExicanData.mode() === "demo";
      const summary = document.getElementById("ledger-summary");
      const mine = document.getElementById("ledger-my-summary");
      let version = 0;
      if (demo) document.querySelectorAll("a[href=\"ledger.html\"]").forEach((link) => { link.search = "?demo=1"; });
      async function loadLedgerSummary() {
        const request = ++version;
        const rows = await ExicanData.ledgerRange();
        if (request !== version) return;
        const month = ExicanLedgerRules.monthOf(ExicanRules.kstDate(new Date()));
        const team = ExicanLedgerRules.teamSummary(rows, month);
        const unpaid = team.unpaidMembers.reduce((sum, row) => sum + row.outstanding, 0);
        summary.textContent = `팀 잔액 ${formatWon(team.balance)} · 이번 달 미납 ${team.unpaidMembers.length}명 (${formatWon(unpaid)})`;
        const personal = ExicanLedgerRules.memberSummary(rows, ExicanMember.getId(), month);
        mine.hidden = !ExicanMember.getId() || personal.outstanding <= 0;
        mine.textContent = mine.hidden ? "" : `내 미납 ${formatWon(personal.outstanding)}`;
      }
      try {
        if (!demo) await ExicanAuth.requireTeam();
        await loadLedgerSummary();
        if (!demo) await ExicanAuth.onAuthChange(async (event, session) => {
          version += 1;
          if (roleFromEmail(session?.user?.email, EXICAN_CONFIG) === "anon") {
            summary.textContent = "팀 로그인 후 장부를 확인하세요";
            mine.textContent = "";
            mine.hidden = true;
          } else {
            try { await loadLedgerSummary(); }
            catch (error) { summary.textContent = "장부를 불러오지 못했습니다. 새로고침해 주세요."; showToast(error.message); }
          }
        });
      } catch (error) {
        summary.textContent = "장부를 불러오지 못했습니다. 새로고침해 주세요.";
        showToast(error.message);
      }
    });
  </script>
</body>
</html>
