<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>⚽ FC EXICAN 운영 허브</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>⚽ FC EXICAN 운영 허브</h1>

  <main>
    <div class="hub-grid">
      <section class="card">
        <h2>이번 주 투표</h2>
        <p id="weekly-poll-summary" aria-live="polite">투표를 불러오는 중입니다…</p>
        <a id="weekly-poll-link" href="vote.html">투표 페이지로</a>
      </section>
      <section class="card">
        <h2>매칭 후보</h2>
        <p>준비 중</p>
        <a href="matches.html">매칭 후보 보기</a>
      </section>
      <section class="card">
        <h2>확정 매치</h2>
        <p>준비 중</p>
        <a href="matches.html">확정 매치 보기</a>
      </section>
      <section class="card">
        <h2>장부 요약</h2>
        <p>준비 중</p>
        <a href="ledger.html">장부 페이지로</a>
      </section>
    </div>
    <a class="hub-rotation-link" href="rotation.html">배정표 만들기</a>
  </main>

  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/ui.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/data.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      renderNav("home");
      const demo = ExicanData.mode() === "demo";
      const summary = document.getElementById("weekly-poll-summary");
      if (demo) {
        document.querySelectorAll('.topnav a[href="index.html"], a[href="vote.html"]').forEach((link) => { link.search = "?demo=1"; });
      }
      async function loadSummary() {
        const [poll, members] = await Promise.all([ExicanData.currentPoll(), ExicanData.members()]);
        if (!poll) {
          summary.textContent = "아직 열린 투표가 없습니다. 일요일 13:00에 자동 생성됩니다.";
          return;
        }
        const votes = await ExicanData.votes(poll.id);
        const { count } = ExicanRules.attendanceSummary(votes, members);
        const date = ExicanRules.kstDate(poll.closes_at).slice(5).replace("-", "/");
        const status = ExicanRules.pollStatus(poll, new Date().toISOString());
        summary.textContent = `참석 ${count}명 · 마감 ${date}(월) 13:00${status === "cancelled" ? " · 취소됨" : status === "closed" ? " · 마감됨" : ""}`;
      }
      try {
        try { await ExicanAuth.renderAuthBar(); }
        catch (error) { if (!demo) throw error; }
        if (!demo) await ExicanAuth.requireTeam();
        await loadSummary();
        if (!demo) await ExicanAuth.onAuthChange(async (event, session) => {
          if (roleFromEmail(session?.user?.email, EXICAN_CONFIG) === "anon") summary.textContent = "팀 로그인 후 투표를 확인하세요";
          else await loadSummary();
        });
      } catch (error) {
        summary.textContent = "투표를 불러오지 못했습니다. 새로고침해 주세요.";
        showToast(error.message);
      }
    });
  </script>
</body>
</html>
